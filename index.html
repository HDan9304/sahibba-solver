<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahibba Solver Board</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
        }
        
        #board {
            display: grid;
            /* 15x15 grid layout */
            grid-template-columns: repeat(15, 1fr);
            gap: 2px;
            width: 600px;
            height: 600px;
            background-color: #2c3e50; /* Acts as the border between cells */
            border: 6px solid #2c3e50;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            border-radius: 4px;
        }

        .cell {
            background-color: #e2e8e4;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            font-weight: bold;
            color: #333;
            user-select: none;
            position: relative;
        }

        /* Multiplier Colors */
        .TW { background-color: #e74c3c; color: white; } /* Triple Word - Red */
        .DW { background-color: #fd79a8; color: white; } /* Double Word - Pink */
        .TL { background-color: #0984e3; color: white; } /* Triple Letter - Blue */
        .DL { background-color: #74b9ff; color: white; } /* Double Letter - Light Blue */
        .ST { background-color: #fd79a8; color: white; font-size: 24px; } /* Center Star */
        
        /* Optional: Class for when your bot places a letter tile */
        .tile {
            background-color: #f1c40f;
            width: 90%;
            height: 90%;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            color: #2c3e50;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.3);
            position: absolute;
            z-index: 10;
        }
    </style>
</head>
<body>

<div id="board"></div>

<script>
    // Standard 15x15 board layout for Sahibba / Scrabble
    const layout = [
        ['TW', '', '', 'DL', '', '', '', 'TW', '', '', '', 'DL', '', '', 'TW'],
        ['', 'DW', '', '', '', 'TL', '', '', '', 'TL', '', '', '', 'DW', ''],
        ['', '', 'DW', '', '', '', 'DL', '', 'DL', '', '', '', 'DW', '', ''],
        ['DL', '', '', 'DW', '', '', '', 'DL', '', '', '', 'DW', '', '', 'DL'],
        ['', '', '', '', 'DW', '', '', '', '', '', 'DW', '', '', '', ''],
        ['', 'TL', '', '', '', 'TL', '', '', '', 'TL', '', '', '', 'TL', ''],
        ['', '', 'DL', '', '', '', 'DL', '', 'DL', '', '', '', 'DL', '', ''],
        ['TW', '', '', 'DL', '', '', '', 'ST', '', '', '', 'DL', '', '', 'TW'],
        ['', '', 'DL', '', '', '', 'DL', '', 'DL', '', '', '', 'DL', '', ''],
        ['', 'TL', '', '', '', 'TL', '', '', '', 'TL', '', '', '', 'TL', ''],
        ['', '', '', '', 'DW', '', '', '', '', '', 'DW', '', '', '', ''],
        ['DL', '', '', 'DW', '', '', '', 'DL', '', '', '', 'DW', '', '', 'DL'],
        ['', '', 'DW', '', '', '', 'DL', '', 'DL', '', '', '', 'DW', '', ''],
        ['', 'DW', '', '', '', 'TL', '', '', '', 'TL', '', '', '', 'DW', ''],
        ['TW', '', '', 'DL', '', '', '', 'TW', '', '', '', 'DL', '', '', 'TW']
    ];

    const boardElement = document.getElementById('board');

    // Generate the grid dynamically into the DOM
    for (let row = 0; row < 15; row++) {
        for (let col = 0; col < 15; col++) {
            const cellType = layout[row][col];
            const cellElement = document.createElement('div');
            
            cellElement.classList.add('cell');
            
            if (cellType) {
                cellElement.classList.add(cellType);
                // Assign a star icon to the center, otherwise label the multiplier
                cellElement.innerText = cellType === 'ST' ? '★' : cellType;
            }
            
            // Assign coordinate data attributes for your solver engine
            cellElement.dataset.row = row;
            cellElement.dataset.col = col;

            boardElement.appendChild(cellElement);
        }
    }
</script>

</body>
</html>
