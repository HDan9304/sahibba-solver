<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sahibba Solver Board</title>
    <style>
        :root {
            --board-bg: #f2f5f7;
            --grid-line: #ffffff;
            --tw-color: #ff7a59; /* Soft Coral */
            --dw-color: #ffb399; /* Peach */
            --tl-color: #8da3b5; /* Slate */
            --dl-color: #cfd8dc; /* Light Gray */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100dvh; /* Locks exactly to screen height, even on mobile */
            background-color: #ffffff; 
            margin: 0;
            padding: 0; /* Remove padding to maximize space */
            box-sizing: border-box;
            overflow: hidden; /* Prevents the whole screen from scrolling */
        }

        /* The scrollable window just for the board */
        #board-casing {
            background-color: transparent;
            padding: 20px;
            border-radius: 8px;
            box-shadow: none;
            margin-top: 65px; /* Safely clear the top rack */
            margin-bottom: 65px; /* Safely clear the bottom rack */
            width: 100%;
            height: 100%;
            overflow: auto; /* Allows panning/scrolling ONLY the board */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #board {
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
            gap: 2px;
            /* Lock dimensions to keep cells large on mobile */
            width: 650px; 
            height: 650px; 
            background-color: var(--grid-line);
            border: 2px solid var(--grid-line);
        }

        .cell {
            background-color: var(--board-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.75rem;
            font-weight: 800;
            color: rgba(0, 0, 0, 0.4);
            text-align: center;
            user-select: none;
            position: relative;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.05);
            border-radius: 2px;
        }

        /* Multiplier Styles */
        .TW { background-color: var(--tw-color); color: white; }
        .DW { background-color: var(--dw-color); color: white; }
        .TL { background-color: var(--tl-color); color: white; }
        .DL { background-color: var(--dl-color); color: white; }
        
        .ST { 
            background-color: var(--dw-color); 
            color: white; 
            font-size: 1.5rem; 
        }

        /* Tile racks (shared styles) */
        .rack-casing {
            background-color: #8e44ad; /* Distinct color for the rack */
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4), inset 0 -3px 0 rgba(0,0,0,0.2);
            position: fixed;
            z-index: 100;
            left: 50%;
            transform: translateX(-50%);
        }

        #opponent-rack { 
            top: 0; 
            border-top-left-radius: 0; 
            border-top-right-radius: 0; 
        }
        #player-rack { 
            bottom: 0; 
            border-bottom-left-radius: 0; 
            border-bottom-right-radius: 0; 
        }

        .rack {
            display: flex;
            gap: 5px;
        }

        .rack-slot {
            width: 45px;
            height: 45px;
            background-color: rgba(255, 255, 255, 0.1);
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Example of a physical letter tile when your bot places one */
        .tile {
            background-color: #f1c40f;
            width: 92%;
            height: 92%;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: #2c3e50;
            box-shadow: 0 4px 0 #d4ac0d, 0 5px 5px rgba(0,0,0,0.4); /* 3D pop effect */
            position: absolute;
            z-index: 10;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* Small subscript number for tile score */
        .tile::after {
            content: attr(data-score);
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 0.5rem;
            color: #2c3e50;
        }

        /* Align board for scrolling on smaller screens */
        @media (max-width: 650px) {
            #board-casing { 
                justify-content: flex-start; 
                align-items: flex-start; 
            }
        }
    </style>
</head>
<body>

<!-- The Game Board Area -->
<div id="opponent-rack" class="rack-casing">
    <div class="rack">
        <div class="rack-slot"></div>
        <div class="rack-slot"></div>
        <div class="rack-slot"></div>
        <div class="rack-slot"></div>
        <div class="rack-slot"></div>
        <div class="rack-slot"></div>
        <div class="rack-slot"></div>
    </div>
</div>

<div id="board-casing">
    <div id="board"></div>
</div>

<div id="player-rack" class="rack-casing">
    <div class="rack">
        <div class="rack-slot"></div>
        <div class="rack-slot"></div>
        <div class="rack-slot"></div>
        <div class="rack-slot"></div>
        <div class="rack-slot"></div>
        <div class="rack-slot"></div>
        <div class="rack-slot"></div>
    </div>
</div>

<script>
    const layout = [
        ['TW', '', '', '', 'DL', '', '', 'TL', '', '', 'DL', '', '', '', 'TW'],
        ['', '', '', 'DW', '', '', 'TL', '', 'TL', '', '', 'DW', '', '', ''],
        ['', '', 'TW', '', '', 'DL', '', '', '', 'DL', '', '', 'TW', '', ''],
        ['', 'DW', '', '', 'DL', '', '', 'DW', '', '', 'DL', '', '', 'DW', ''],
        ['DL', '', '', 'DL', '', '', 'DL', '', 'DL', '', '', 'DL', '', '', 'DL'],
        ['', '', 'DL', '', '', 'TL', '', '', '', 'TL', '', '', 'DL', '', ''],
        ['', 'TL', '', '', 'DL', '', '', '', '', '', 'DL', '', '', 'TL', ''],
        ['TL', '', '', 'DW', '', '', '', 'ST', '', '', '', 'DW', '', '', 'TL'],
        ['', 'TL', '', '', 'DL', '', '', '', '', '', 'DL', '', '', 'TL', ''],
        ['', '', 'DL', '', '', 'TL', '', '', '', 'TL', '', '', 'DL', '', ''],
        ['DL', '', '', 'DL', '', '', 'DL', '', 'DL', '', '', 'DL', '', '', 'DL'],
        ['', 'DW', '', '', 'DL', '', '', 'DW', '', '', 'DL', '', '', 'DW', ''],
        ['', '', 'TW', '', '', 'DL', '', '', '', 'DL', '', '', 'TW', '', ''],
        ['', '', '', 'DW', '', '', 'TL', '', 'TL', '', '', 'DW', '', '', ''],
        ['TW', '', '', '', 'DL', '', '', 'TL', '', '', 'DL', '', '', '', 'TW'],
    ];

    const boardElement = document.getElementById('board');

    // Generate the grid
    for (let row = 0; row < 15; row++) {
        for (let col = 0; col < 15; col++) {
            const cellType = layout[row][col];
            const cellElement = document.createElement('div');
            
            cellElement.classList.add('cell');
            
            if (cellType) {
                cellElement.classList.add(cellType);
                const labels = { 'TW': '3W', 'DW': '2W', 'TL': '3L', 'DL': '2L', 'ST': '★' };
                cellElement.innerText = labels[cellType] || cellType;
            }
            
            // X and Y coordinates for your bot to target
            cellElement.dataset.row = row;
            cellElement.dataset.col = col;

            boardElement.appendChild(cellElement);
        }
    }

    // --- DEMO: How to place a tile via JavaScript ---
    // This function shows how your solver bot will eventually push moves to the UI
    function placeTile(row, col, letter, score) {
        const targetCell = document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
        if (targetCell) {
            const tile = document.createElement('div');
            tile.classList.add('tile');
            tile.innerText = letter;
            tile.dataset.score = score; // Adds the little number to the bottom right
            targetCell.appendChild(tile);
            // Hide the text of the multiplier beneath the tile
            targetCell.style.color = 'transparent'; 
        }
    }

</script>

</body>
</html>
